baseURL = "https://quadratmeterberechnen.github.io/"
title = "Quadratmeter berechnen"
languageCode = "de-DE"
defaultContentLanguage = "de"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = false
enableGitInfo = false

[params]
  homeTitle = "Quadratmeter berechnen – Kostenloser Flächenrechner"
  description = "Quadratmeter berechnen leicht gemacht: Kostenloser Rechner für Rechteck, Dreieck, Kreis und Trapez mit Formeln, Beispielen und Umrechnung in m², cm², ha."
  ogImage = "/img/og-default.png"

[markup.goldmark.renderer]
  unsafe = false

[minify]
  minifyOutput = true

[sitemap]
  changefreq = "monthly"
  priority = 0.5

