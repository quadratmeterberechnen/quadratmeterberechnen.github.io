<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}">Quadratmeter berechnen</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menü"><span class="bars"></span></button>
    <nav aria-label="Hauptmenü">
      <ul id="menu" class="nav-menu">
        {{ $cur := . }}
        {{ range site.Menus.main }}
        {{ $active := cond (eq .URL "/") $cur.IsHome (hasPrefix $cur.RelPermalink .URL) }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
